<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" fill="#f1f5f9"/>
  <rect x="0" y="480" width="800" height="120" fill="#e2e8f0"/>
  <!-- Software window -->
  <rect x="60" y="40" width="680" height="420" rx="12" fill="#1e293b"/>
  <!-- Window title bar -->
  <rect x="60" y="40" width="680" height="36" rx="12" fill="#334155"/>
  <rect x="60" y="60" width="680" height="16" fill="#334155"/>
  <!-- Window buttons -->
  <circle cx="80" cy="58" r="6" fill="#ef4444"/>
  <circle cx="100" cy="58" r="6" fill="#f59e0b"/>
  <circle cx="120" cy="58" r="6" fill="#22c55e"/>
  <!-- Title text -->
  <text x="400" y="62" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">NEWARE BTS-8.0  Battery Testing System</text>
  <!-- Menu bar -->
  <rect x="60" y="76" width="680" height="28" fill="#0f172a"/>
  <text x="80" y="94" font-family="monospace" font-size="11" fill="#94a3b8">File</text>
  <text x="130" y="94" font-family="monospace" font-size="11" fill="#94a3b8">Edit</text>
  <text x="175" y="94" font-family="monospace" font-size="11" fill="#94a3b8">Test</text>
  <text x="225" y="94" font-family="monospace" font-size="11" fill="#94a3b8">Data</text>
  <text x="275" y="94" font-family="monospace" font-size="11" fill="#94a3b8">Report</text>
  <text x="335" y="94" font-family="monospace" font-size="11" fill="#94a3b8">Help</text>
  <!-- Toolbar -->
  <rect x="60" y="104" width="680" height="32" fill="#1e293b"/>
  <rect x="70" y="110" width="24" height="20" rx="3" fill="#3b82f6"/>
  <text x="82" y="124" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffffff">¶</text>
  <rect x="100" y="110" width="24" height="20" rx="3" fill="#334155"/>
  <text x="112" y="124" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">ø</text>
  <rect x="130" y="110" width="24" height="20" rx="3" fill="#334155"/>
  <text x="142" y="124" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">ù</text>
  <rect x="160" y="110" width="24" height="20" rx="3" fill="#334155"/>
  <text x="172" y="124" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">ó</text>
  <!-- Separator -->
  <line x1="195" y1="112" x2="195" y2="128" stroke="#475569" stroke-width="1"/>
  <!-- Channel selector -->
  <rect x="200" y="110" width="80" height="20" rx="3" fill="#334155"/>
  <text x="240" y="124" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">CH 1-8 ¾</text>
  <!-- Main content area -->
  <!-- Left sidebar - channel list -->
  <rect x="60" y="136" width="120" height="324" fill="#0f172a"/>
  <text x="75" y="155" font-family="monospace" font-size="9" fill="#475569">CHANNELS</text>
  <rect x="68" y="162" width="104" height="24" rx="3" fill="#1e40af"/>
  <text x="120" y="177" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffffff">CH01 ¶</text>
  <rect x="68" y="190" width="104" height="24" rx="3" fill="#1e293b"/>
  <text x="120" y="205" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">CH02 ø</text>
  <rect x="68" y="218" width="104" height="24" rx="3" fill="#1e293b"/>
  <text x="120" y="233" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">CH03 ø</text>
  <rect x="68" y="246" width="104" height="24" rx="3" fill="#1e293b"/>
  <text x="120" y="261" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">CH04 ø</text>
  <rect x="68" y="274" width="104" height="24" rx="3" fill="#1e293b"/>
  <text x="120" y="289" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">CH05 ø</text>
  <rect x="68" y="302" width="104" height="24" rx="3" fill="#1e293b"/>
  <text x="120" y="317" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">CH06 ø</text>
  <rect x="68" y="330" width="104" height="24" rx="3" fill="#1e293b"/>
  <text x="120" y="345" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">CH07 ø</text>
  <rect x="68" y="358" width="104" height="24" rx="3" fill="#1e293b"/>
  <text x="120" y="373" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">CH08 ø</text>
  <!-- Main chart area -->
  <rect x="180" y="136" width="560" height="250" rx="6" fill="#0f172a"/>
  <!-- Chart grid -->
  <line x1="180" y1="195" x2="740" y2="195" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="180" y1="261" x2="740" y2="261" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="180" y1="327" x2="740" y2="327" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="280" y1="136" x2="280" y2="386" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="380" y1="136" x2="380" y2="386" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="480" y1="136" x2="480" y2="386" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="580" y1="136" x2="580" y2="386" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="680" y1="136" x2="680" y2="386" stroke="#1e293b" stroke-width="0.5"/>
  <!-- Data lines -->
  <polyline points="180,320 220,295 260,330 300,280 340,310 380,260 420,300 460,250 500,285 540,240 580,275 620,245 660,270 700,248 740,260" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <polyline points="180,350 220,340 260,355 300,330 340,345 380,320 420,340 460,315 500,330 540,310 580,325 620,308 660,318 700,305 740,315" stroke="#22c55e" stroke-width="1.5" fill="none"/>
  <!-- Chart legend -->
  <rect x="185" y="141" width="12" height="8" rx="1" fill="#3b82f6"/>
  <text x="200" y="149" font-family="monospace" font-size="8" fill="#94a3b8">Voltage (V)</text>
  <rect x="265" y="141" width="12" height="8" rx="1" fill="#22c55e"/>
  <text x="280" y="149" font-family="monospace" font-size="8" fill="#94a3b8">Current (A)</text>
  <!-- Data panel below chart -->
  <rect x="180" y="390" width="560" height="70" rx="6" fill="#1e293b"/>
  <rect x="185" y="395" width="130" height="60" rx="4" fill="#0f172a"/>
  <text x="250" y="412" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">VOLTAGE</text>
  <text x="250" y="432" text-anchor="middle" font-family="monospace" font-size="14" fill="#3b82f6" font-weight="bold">4.187V</text>
  <rect x="325" y="395" width="130" height="60" rx="4" fill="#0f172a"/>
  <text x="390" y="412" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">CURRENT</text>
  <text x="390" y="432" text-anchor="middle" font-family="monospace" font-size="14" fill="#22c55e" font-weight="bold">1.000A</text>
  <rect x="465" y="395" width="130" height="60" rx="4" fill="#0f172a"/>
  <text x="530" y="412" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">CAPACITY</text>
  <text x="530" y="432" text-anchor="middle" font-family="monospace" font-size="14" fill="#f59e0b" font-weight="bold">2534mAh</text>
  <rect x="605" y="395" width="130" height="60" rx="4" fill="#0f172a"/>
  <text x="670" y="412" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">CYCLE</text>
  <text x="670" y="432" text-anchor="middle" font-family="monospace" font-size="14" fill="#a78bfa" font-weight="bold">#142</text>
  <!-- Progress bar -->
  <rect x="185" y="395" width="545" height="4" rx="2" fill="#334155"/>
  <rect x="185" y="395" width="218" height="4" rx="2" fill="#3b82f6"/>
  <!-- Battery cell next to software -->
  <rect x="700" y="200" width="60" height="120" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="710" y="185" width="40" height="18" rx="4" fill="#93c5fd"/>
  <text x="730" y="265" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e40af">18650</text>
  <!-- Cable from device to battery -->
  <path d="M 700 260 Q 660 280 650 300" stroke="#94a3b8" stroke-width="2" fill="none"/>
</svg>
