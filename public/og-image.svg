<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0f172a"/>
  <!-- Grid pattern -->
  <pattern id="og-grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e3a5f" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#og-grid)"/>
  <!-- Glow blobs -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="#1e40af" opacity="0.15"/>
  <ellipse cx="200" cy="200" rx="200" ry="150" fill="#3b82f6" opacity="0.1"/>
  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="14" fill="#1e40af"/>
    <rect x="16" y="12" width="32" height="40" rx="5" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    <rect x="22" y="6" width="20" height="8" rx="4" fill="#60a5fa"/>
    <rect x="19" y="22" width="26" height="24" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="22" y="26" width="20" height="5" rx="1" fill="#1e40af" opacity="0.6"/>
    <rect x="22" y="35" width="12" height="3" rx="1" fill="#1e40af" opacity="0.4"/>
  </g>
  <!-- Brand name -->
  <text x="165" y="122" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff">NEWARE</text>
  <text x="165" y="145" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">Precision Battery Testing Equipment</text>
  <!-- Divider -->
  <line x1="80" y1="180" x2="1120" y2="180" stroke="#1e3a5f" stroke-width="1"/>
  <!-- Main headline -->
  <text x="600" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff">
    <tspan fill="#ffffff">Precision Battery</tspan>
  </text>
  <text x="600" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#3b82f6">
    Testing Equipment
  </text>
  <!-- Sub headline -->
  <text x="600" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">
    Since 1998 · 150+ Countries · 32,000+ Customers
  </text>
  <!-- Bottom stats -->
  <rect x="200" y="470" width="200" height="80" rx="12" fill="#1e3a5f" opacity="0.8"/>
  <text x="300" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#60a5fa">1000Hz</text>
  <text x="300" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Max Sampling Rate</text>
  <rect x="450" y="470" width="200" height="80" rx="12" fill="#1e3a5f" opacity="0.8"/>
  <text x="550" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#60a5fa">0.02%</text>
  <text x="550" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Measurement Accuracy</text>
  <rect x="700" y="470" width="200" height="80" rx="12" fill="#1e3a5f" opacity="0.8"/>
  <text x="800" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#60a5fa">70%+</text>
  <text x="800" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Energy Recovery</text>
  <rect x="950" y="470" width="200" height="80" rx="12" fill="#1e3a5f" opacity="0.8"/>
  <text x="1050" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#60a5fa">8 Series</text>
  <text x="1050" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Product Lines</text>
  <!-- URL -->
  <text x="600" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">neware.com.cn</text>
</svg>
