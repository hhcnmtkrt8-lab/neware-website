<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#f8fafc"/>
  <rect width="800" height="600" fill="url(#grid)" opacity="0.4"/>
  <!-- Battery cycler device illustration -->
  <g transform="translate(200, 150)">
    <!-- Main chassis -->
    <rect x="0" y="0" width="400" height="300" rx="16" fill="#e2e8f0"/>
    <rect x="4" y="4" width="392" height="292" rx="14" fill="#f8fafc"/>
    <!-- Screen area -->
    <rect x="20" y="20" width="360" height="180" rx="8" fill="#0f172a"/>
    <!-- Screen content - waveform -->
    <polyline points="20,130 60,100 100,140 140,90 180,150 220,80 260,130 300,95 340,120 380,105" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <!-- Screen grid lines -->
    <line x1="20" y1="80" x2="380" y2="80" stroke="#334155" stroke-width="0.5"/>
    <line x1="20" y1="110" x2="380" y2="110" stroke="#334155" stroke-width="0.5"/>
    <line x1="20" y1="140" x2="380" y2="140" stroke="#334155" stroke-width="0.5"/>
    <line x1="20" y1="170" x2="380" y2="170" stroke="#334155" stroke-width="0.5"/>
    <!-- Channel indicators -->
    <rect x="20" y="20" width="80" height="20" rx="4" fill="#1e3a5f"/>
    <text x="60" y="34" text-anchor="middle" fill="#60a5fa" font-size="10" font-family="monospace">CH01-08</text>
    <!-- Status panel -->
    <rect x="280" y="20" width="100" height="40" rx="4" fill="#1e3a5f"/>
    <text x="330" y="34" text-anchor="middle" fill="#22c55e" font-size="10" font-family="monospace">� RUN</text>
    <text x="330" y="48" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">10Hz 50mA</text>
    <!-- Control buttons -->
    <rect x="20" y="215" width="50" height="30" rx="6" fill="#cbd5e1"/>
    <rect x="80" y="215" width="50" height="30" rx="6" fill="#3b82f6"/>
    <rect x="140" y="215" width="50" height="30" rx="6" fill="#cbd5e1"/>
    <rect x="200" y="215" width="50" height="30" rx="6" fill="#cbd5e1"/>
    <!-- Data display -->
    <rect x="270" y="210" width="110" height="40" rx="6" fill="#e2e8f0"/>
    <text x="325" y="228" text-anchor="middle" fill="#1e40af" font-size="8" font-family="monospace">VOLTAGE</text>
    <text x="325" y="243" text-anchor="middle" fill="#1e293b" font-size="11" font-family="monospace" font-weight="bold">3.847 V</text>
    <!-- Cooling vents -->
    <rect x="20" y="260" width="360" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="20" y="270" width="360" height="6" rx="3" fill="#cbd5e1"/>
    <!-- LED indicators -->
    <circle cx="340" cy="268" r="3" fill="#22c55e"/>
    <circle cx="355" cy="268" r="3" fill="#3b82f6"/>
  </g>
  <!-- Battery cells floating -->
  <rect x="80" y="320" width="60" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="90" y="305" width="40" height="18" rx="4" fill="#93c5fd"/>
  <text x="110" y="370" text-anchor="middle" fill="#1e40af" font-size="10" font-family="sans-serif">CR2032</text>
  <rect x="170" y="300" width="70" height="110" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="180" y="282" width="50" height="20" rx="4" fill="#86efac"/>
  <text x="205" y="362" text-anchor="middle" fill="#166534" font-size="10" font-family="sans-serif">18650</text>
  <rect x="620" y="300" width="80" height="120" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <rect x="630" y="280" width="60" height="22" rx="4" fill="#fde047"/>
  <text x="660" y="365" text-anchor="middle" fill="#854d0e" font-size="10" font-family="sans-serif">Pouch Cell</text>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-width="0.5"/>
    </pattern>
  </defs>
</svg>
